[project]
name = "analysis-ros"
version = "0.1.0"
description = "Analysis tools for ROS logs."
dependencies = ["analysis-lcm"]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.3,<0.12" ]

[tool.uv.build-backend]
module-name = "analysis.ros"

[project.scripts]
lcm_to_ros = 'analysis.ros.convert_log_to_ros:main'

