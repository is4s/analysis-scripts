[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.3,<0.12" ]

[project]
name = "analysis-lcm"
version = "0.1.2"
description = "Analysis tools for LCM logs."
readme = "README.md"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
authors = [ { name = "IS4S", email = "pntos@is4s.com" } ]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aspn23",
    "aspn23-lcm",
    "inu==1.1.0",
    "lcm>=1.5.1,<2",
    "matplotlib>=3.9.3",
    "navtk",
    "numpy==1.26.4",
    "pyyaml>=6.0.0",
    "scipy>=1.15.2",
    "tabulate>=0.9.0",
    "tomlkit>=0.13.0",
    "tqdm",
]
scripts.altitude = "analysis.lcm.scripts.plot_alt:main"
scripts.dt = "analysis.lcm.scripts.plot_dt:main"
scripts.get_imu_rotation = "analysis.lcm.scripts.get_imu_rotations:main"
scripts.imu = "analysis.lcm.scripts.plot_imu:main"
scripts.magnetometer = "analysis.lcm.scripts.plot_mag:main"
scripts.position = "analysis.lcm.scripts.plot_pos:main"
scripts.print_channels = "analysis.lcm.scripts.print_channels:main"
scripts.pva = "analysis.lcm.scripts.plot_pva:main"
scripts.range_rate = "analysis.lcm.scripts.plot_range_rate_to_point:main"
scripts.remove_channels = "analysis.lcm.scripts.remove_channels:main"
scripts.rename_channels = "analysis.lcm.scripts.rename_channels:main"
scripts.sort_log = "analysis.lcm.scripts.sort_log_by_time:main"
scripts.speed = "analysis.lcm.scripts.plot_speed:main"
scripts.stationary_imu = "analysis.lcm.scripts.plot_stationary_imu:main"
scripts.timespan = "analysis.lcm.scripts.get_time_range:main"
scripts.timestamps = "analysis.lcm.scripts.plot_time:main"
scripts.velocity = "analysis.lcm.scripts.plot_vel:main"

[tool.uv]
# aspn-generated main branch - committed 21 April 2026
sources.aspn23 = { git = "https://github.com/is4s/aspn-generated.git", rev = "7e1f35bc84b90c6d361e690601448f8087e1a626", subdirectory = "aspn-py" }
sources.aspn23_lcm = { git = "https://github.com/is4s/aspn-generated.git", rev = "7e1f35bc84b90c6d361e690601448f8087e1a626", subdirectory = "lcm/python" }
build-backend.module-name = "analysis.lcm"
