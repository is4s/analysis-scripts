[project]
name = "analysis-scripts"
version = "0.1.0"
description = "A project for various analysis tools."
dependencies = []
readme = "README.md"
requires-python = ">= 3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["analysis-lcm", "analysis-ros"]

[tool.uv.sources]
analysis-lcm = { workspace = true }
analysis-ros = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.4.5",
    "pip>=24.0",
    "analysis-lcm",
    "analysis-ros",
    "uv==0.11.3",
]

[tool.ruff.lint]
extend-select = ["I"]
select = ["D", "D213"]
ignore = ["D212", "D417"]

[tool.ruff.lint.per-file-ignores]
"analysis-lcm/*" = ["D"]
"analysis-ros/*" = ["D"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
